name: Release

# Releases automatically when main has a package.json version that has not
# been released yet: runs the checks, publishes to npm, then creates the
# vX.Y.Z tag and GitHub Release. Every step skips work that is already done,
# so a failed run can simply be re-run. To release, bump "version" in
# package.json (npm version patch|minor|major --no-git-tag-version) and merge.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to release (its package.json version is used). Use to backfill a missed tag/release."
        required: false
        default: "main"

# Nothing by default; the job asks only for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'paidmcp/client'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm provenance
    env:
      # Untrusted input is passed through env, never pasted into scripts.
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Work out what needs releasing
        id: plan
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="v$VERSION"
          SHA="$(git rev-parse HEAD)"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED=true
          else
            PUBLISHED=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASED=true
          else
            RELEASED=false
          fi
          # A tag that already exists must point at this commit; otherwise
          # the version was not bumped and we refuse to move it.
          # Commit the tag points at (peeled "^{}" line for annotated tags).
          TAG_SHA="$(git ls-remote --tags origin | awk -v t="refs/tags/$TAG" \
            '$2 == t "^{}" { peeled = $1 } $2 == t { plain = $1 }
             END { print (peeled != "" ? peeled : plain) }')"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$SHA" ]; then
            if [ "$PUBLISHED" = true ] && [ "$RELEASED" = true ]; then
              echo "$TAG is already released from another commit; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Tag $TAG already points at $TAG_SHA, not $SHA. Bump the version in package.json."
            exit 1
          fi
          # GitHub does not let this workflow's token create a tag on a
          # commit whose .github/workflows differ from the default branch
          # (that needs the "workflows" permission, which GITHUB_TOKEN cannot
          # have). Stop before publishing anything and say what to do.
          if [ -z "$TAG_SHA" ] && [ "$RELEASED" = false ]; then
            git fetch -q --depth=1 origin "$DEFAULT_BRANCH"
            if [ "$(git rev-parse -q --verify HEAD:.github/workflows)" != \
                 "$(git rev-parse -q --verify FETCH_HEAD:.github/workflows)" ]; then
              echo "::error::$SHA has different workflow files than $DEFAULT_BRANCH, so GitHub does not allow this workflow to create tag $TAG. Create the tag yourself (Releases > Draft a new release > tag $TAG, target $SHA, or: git tag $TAG $SHA && git push origin $TAG), then re-run this workflow to publish and create the release."
              exit 1
            fi
          fi
          case "$VERSION" in
            *-*) NPM_DIST_TAG=next; PRERELEASE=true ;;
            *) NPM_DIST_TAG=latest; PRERELEASE=false ;;
          esac
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "published=$PUBLISHED"
            echo "released=$RELEASED"
            echo "npm_dist_tag=$NPM_DIST_TAG"
            echo "prerelease=$PRERELEASE"
            if [ "$PUBLISHED" = true ] && [ "$RELEASED" = true ]; then
              echo "skip=true"
            else
              echo "skip=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "$NAME $VERSION: published on npm=$PUBLISHED, GitHub Release=$RELEASED"

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.skip == 'false'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install and check
        if: steps.plan.outputs.skip == 'false'
        run: |
          npm ci
          npm run check

      - name: Publish to npm
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

      - name: Create tag and GitHub Release
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.released == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          # Creates the tag on $SHA if it does not exist yet.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes $FLAGS
